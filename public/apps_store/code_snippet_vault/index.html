<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Snippet Vault - 개발자 코드 캡슐</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    code, pre {
      font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-600 to-rose-600 flex items-center justify-center shadow-lg shadow-amber-600/30">
          <i data-lucide="code-2" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg text-white">Code Snippet Vault</h1>
            <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">v1.1.0 (100円 App)</span>
          </div>
          <p class="text-[11px] text-slate-400">자주 쓰는 코드 조각과 설정값을 보관하고 초스피드로 검색</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-gradient-to-r from-amber-500 to-rose-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg hover:opacity-95 transition-all">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>새 스니펫 추가</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    
    <!-- Top Search & Filter Bar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-6">
      <div class="relative w-full sm:w-96">
        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
        <input
          type="text"
          id="searchInput"
          oninput="renderSnippets()"
          placeholder="코드 스니펫 제목, 언어, 키워드 검색..."
          class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:border-amber-500 focus:outline-none"
        />
      </div>

      <!-- Language Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 scrollbar-none">
        <button onclick="filterLang('ALL')" class="lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-amber-500 text-slate-950">전체</button>
        <button onclick="filterLang('TypeScript')" class="lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800">TypeScript</button>
        <button onclick="filterLang('Python')" class="lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800">Python</button>
        <button onclick="filterLang('CSS')" class="lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800">CSS/Tailwind</button>
        <button onclick="filterLang('SQL')" class="lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800">SQL</button>
      </div>
    </div>

    <!-- Snippets Grid -->
    <div id="snippetsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Snippets will be dynamically rendered -->
    </div>

  </main>

  <!-- Add Snippet Modal -->
  <div id="addModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-md">
    <div class="relative w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900 p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="code" class="w-4 h-4 text-amber-400"></i>
          새 스니펫 저장
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">스니펫 제목</label>
          <input type="text" id="newTitle" placeholder="예: React Fetch Custom Hook" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-amber-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">언어</label>
          <select id="newLang" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
            <option value="TypeScript">TypeScript / JavaScript</option>
            <option value="Python">Python</option>
            <option value="CSS">CSS / Tailwind</option>
            <option value="SQL">SQL</option>
            <option value="Shell">Bash / Shell</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">코드 내용</label>
          <textarea id="newCode" rows="6" placeholder="// 코드를 입력하세요" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-amber-300 focus:border-amber-500 focus:outline-none"></textarea>
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-2">
        <button onclick="closeAddModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">취소</button>
        <button onclick="saveSnippet()" class="px-5 py-2 text-xs font-bold text-slate-950 bg-amber-400 rounded-xl hover:bg-amber-300 shadow-md">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 hidden bg-emerald-600 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-xl flex items-center gap-2 z-50">
    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
    <span>클립보드에 코드가 복사되었습니다!</span>
  </div>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Code Snippet Vault - 어플 100엔 샾 전용 라이선스</p>
  </footer>

  <script>
    lucide.createIcons();

    let sampleSnippets = [
      {
        id: 'snip-1',
        title: 'React Custom Fetch Hook',
        lang: 'TypeScript',
        code: `import { useState, useEffect } from 'react';\n\nexport function useFetch<T>(url: string) {\n  const [data, setData] = useState<T | null>(null);\n  useEffect(() => {\n    fetch(url).then(res => res.json()).then(setData);\n  }, [url]);\n  return { data };\n}`
      },
      {
        id: 'snip-2',
        title: 'Python File Rembg Clean Wrapper',
        lang: 'Python',
        code: `from rembg import remove\nfrom PIL import Image\n\ndef remove_bg(input_path, output_path):\n    img = Image.open(input_path)\n    output = remove(img)\n    output.save(output_path)`
      },
      {
        id: 'snip-3',
        title: 'Glassmorphism Card CSS Tokens',
        lang: 'CSS',
        code: `.glass-card {\n  background: rgba(15, 23, 42, 0.65);\n  backdrop-filter: blur(16px);\n  border: 1px solid rgba(255, 255, 255, 0.08);\n  border-radius: 1.5rem;\n}`
      },
      {
        id: 'snip-4',
        title: 'PostgreSQL User Purchase Aggregation',
        lang: 'SQL',
        code: `SELECT user_id, COUNT(id) as total_apps, SUM(price_jpy) as total_spent\nFROM purchases\nGROUP BY user_id\nORDER BY total_spent DESC;`
      }
    ];

    let snippets = JSON.parse(localStorage.getItem('app100yen_snippets') || 'null') || sampleSnippets;
    let selectedLang = 'ALL';

    function renderSnippets() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('snippetsGrid');
      grid.innerHTML = '';

      const filtered = snippets.filter(s => {
        const matchLang = selectedLang === 'ALL' || s.lang === selectedLang;
        const matchSearch = s.title.toLowerCase().includes(search) || s.code.toLowerCase().includes(search);
        return matchLang && matchSearch;
      });

      filtered.forEach(s => {
        const card = document.createElement('div');
        card.className = "rounded-3xl border border-slate-800 bg-slate-900/80 p-5 space-y-3 flex flex-col justify-between hover:border-slate-700 transition-all";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">${s.lang}</span>
              <button onclick="copyCode('${s.id}')" class="flex items-center gap-1 text-xs font-bold text-slate-400 hover:text-white bg-slate-950 px-3 py-1 rounded-lg border border-slate-800 transition-colors">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                <span>복사</span>
              </button>
            </div>
            <h4 class="text-sm font-bold text-white mb-2">${s.title}</h4>
            <pre class="p-3 bg-slate-950 rounded-xl border border-slate-800/80 text-xs text-amber-300 overflow-x-auto max-h-48 scrollbar-none"><code>${escapeHtml(s.code)}</code></pre>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function filterLang(lang) {
      selectedLang = lang;
      document.querySelectorAll('.lang-tab').forEach(b => {
        b.className = "lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-900 text-slate-400 hover:text-white border border-slate-800";
      });
      event.target.className = "lang-tab px-3 py-1.5 text-xs font-bold rounded-xl bg-amber-500 text-slate-950";
      renderSnippets();
    }

    function copyCode(id) {
      const snip = snippets.find(s => s.id === id);
      if (!snip) return;
      navigator.clipboard.writeText(snip.code).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2500);
      });
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function saveSnippet() {
      const title = document.getElementById('newTitle').value.trim();
      const lang = document.getElementById('newLang').value;
      const code = document.getElementById('newCode').value.trim();

      if (!title || !code) {
        alert('제목과 코드를 입력해 주세요.');
        return;
      }

      const newSnip = {
        id: 'snip-' + Date.now(),
        title,
        lang,
        code
      };

      snippets.unshift(newSnip);
      localStorage.setItem('app100yen_snippets', JSON.stringify(snippets));

      document.getElementById('newTitle').value = '';
      document.getElementById('newCode').value = '';

      closeAddModal();
      renderSnippets();
    }

    renderSnippets();
  </script>
</body>
</html>
