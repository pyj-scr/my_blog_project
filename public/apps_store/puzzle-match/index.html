<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧩 Puzzle Match - Photo Piece Puzzle Game</title>
  <meta name="description" content="Match photo pieces to complete the picture! Challenge all 50 stages!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ===== HOME SCREEN ===== -->
    <div id="screen-home" class="screen active">
      <div class="home-container">
        <div class="home-header">
          <button id="btn-settings-home" class="icon-btn" aria-label="Settings">⚙️</button>
          <h1 class="game-title">🧩 Puzzle Match</h1>
          <div class="header-spacer"></div>
        </div>
        <div class="stage-list" id="stage-list"></div>
      </div>
    </div>

    <!-- ===== GAME SCREEN ===== -->
    <div id="screen-game" class="screen">
      <div class="game-container">
        <div class="game-header">
          <button id="btn-settings-game" class="icon-btn" aria-label="Settings">⚙️</button>
          <div class="stage-info">
            <div class="difficulty-label" id="game-difficulty">Easy</div>
            <div class="stage-number" id="game-stage-num">1</div>
          </div>
          <div class="timer-wrap">
            <span class="timer" id="game-timer">0:00</span>
          </div>
        </div>
        <div class="game-board" id="game-board"></div>
        <div class="game-footer">
          <div class="moves-display">
            <span class="moves-label">Moves</span>
            <span class="moves-count" id="game-moves">0</span>
          </div>
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <span class="progress-text" id="progress-text">0/4</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-content">
        <div class="loading-spinner">🧩</div>
        <div class="loading-label">Loading images...</div>
        <div class="loading-bar-wrap">
          <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== SETTINGS MODAL ===== -->
  <div id="modal-settings" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title-text">Settings</span>
        <button id="btn-close-settings" class="close-btn" aria-label="Close">✕</button>
      </div>
      <div class="settings-toggles">
        <button class="toggle-btn active" id="toggle-bgm" title="Background Music">
          <span class="toggle-icon">🎵</span>
          <span class="toggle-label">Music</span>
        </button>
        <button class="toggle-btn active" id="toggle-sfx" title="Sound Effects">
          <span class="toggle-icon">🔊</span>
          <span class="toggle-label">SFX</span>
        </button>
        <button class="toggle-btn active" id="toggle-vibration" title="Vibration">
          <span class="toggle-icon">📳</span>
          <span class="toggle-label">Vibration</span>
        </button>
      </div>
      <button id="btn-go-home" class="home-btn">🏠 Home</button>
      <div class="modal-footer-text">
        <span class="version-text">Version 1.0.0</span>
      </div>
    </div>
  </div>

  <!-- ===== STAGE CLEAR MODAL ===== -->
  <div id="modal-clear" class="modal-overlay">
    <div class="modal-box clear-box">
      <div class="clear-title">🎉 Stage Clear!</div>
      <div class="clear-stars" id="clear-stars">⭐⭐⭐</div>
      <div class="clear-stats">
        <div class="stat-row">
          <span class="stat-label">⏱️ Time</span>
          <span class="stat-value" id="clear-time">0:00</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">🔄 Moves</span>
          <span class="stat-value" id="clear-moves">0</span>
        </div>
      </div>
      <button id="btn-next-stage" class="next-btn">Next Stage ▶</button>
      <button id="btn-back-home" class="back-btn">Select Stage</button>
    </div>
  </div>

  <!-- ===== CONFETTI CANVAS ===== -->
  <canvas id="confetti-canvas"></canvas>

  <script src="js/tiles.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
